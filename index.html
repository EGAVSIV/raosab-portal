<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaoSab Portal | 50+ Specialized Applications</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f17;
      --panel-bg: rgba(22, 27, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-red: #ff4b4b;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    /* Sidebar Styling */
    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .brand-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff4b4b, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 75, 75, 0.3);
    }

    .brand-title h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
    .brand-title p { font-size: 0.75rem; color: var(--text-muted); }

    .search-wrapper { padding: 16px 20px 8px 20px; position: relative; }
    .search-wrapper i { position: absolute; left: 32px; top: 29px; color: var(--text-muted); font-size: 0.85rem; }
    .search-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .search-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

    .app-directory { flex: 1; overflow-y: auto; padding: 12px 16px; }

    .category-card { margin-bottom: 16px; }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      user-select: none;
    }
    .category-header:hover { background: rgba(255, 255, 255, 0.03); }
    .category-header i.badge-icon { margin-right: 8px; font-size: 0.9rem; }

    .app-grid { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      color: #d1d5db;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .app-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.05);
      transform: translateX(3px);
    }

    .app-item.active {
      background: linear-gradient(90deg, rgba(255, 75, 75, 0.15), rgba(139, 92, 246, 0.15));
      border-color: rgba(255, 75, 75, 0.4);
      color: #fff;
      font-weight: 600;
    }

    .app-item .open-ext {
      opacity: 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: opacity 0.2s ease;
    }
    .app-item:hover .open-ext { opacity: 1; }

    /* Main Area Layout */
    #main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }

    .top-navbar {
      height: 60px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .active-app-info { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }
    .current-title { font-size: 0.95rem; font-weight: 600; }

    .nav-actions { display: flex; gap: 10px; }
    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }

    .viewport-container { flex: 1; position: relative; background: #0e1117; }
    iframe { width: 100%; height: 100%; border: none; }

    /* Loading Overlay */
    .loader-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0e1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Category Specific Badge Colors */
    .color-astro { color: var(--accent-purple); }
    .color-options { color: var(--accent-red); }
    .color-market { color: var(--accent-green); }
    .color-technical { color: var(--accent-blue); }
    .color-news { color: var(--accent-orange); }
    .color-utilities { color: var(--accent-cyan); }
  </style>
</head>
<body>

  <!-- Sidebar Directory -->
  <div id="sidebar">
    <div class="brand-header">
      <div class="brand-logo">RS</div>
      <div class="brand-title">
        <h1>RaoSab Hub</h1>
        <p>50+ Specialized Applications</p>
      </div>
    </div>

    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search" class="search-input" placeholder="Search applications..." onkeyup="filterApps()">
    </div>

    <div class="app-directory" id="appList"></div>
  </div>

  <!-- Main Display Area -->
  <div id="main-wrapper">
    <div class="top-navbar">
      <div class="active-app-info">
        <div class="status-dot"></div>
        <span class="current-title" id="activeAppTitle">Loading App...</span>
      </div>
      <div class="nav-actions">
        <button class="action-btn" onclick="reloadIframe()"><i class="fa-solid fa-rotate-right"></i> Reload</button>
        <button class="action-btn" onclick="openExternal()"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Direct</button>
      </div>
    </div>

    <div class="viewport-container">
      <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Connecting to Streamlit service...</p>
      </div>
      <iframe id="appViewer" src="" onload="hideLoader()"></iframe>
    </div>
  </div>

  <script>
    const appsData = [
      {
        category: "Astro & Cycles",
        icon: "fa-solid fa-moon",
        colorClass: "color-astro",
        apps: [
          { name: "Fibre Tracement", url: "https://fibretracement.streamlit.app" },
          { name: "Birth Charts", url: "https://birthcharts.streamlit.app" },
          { name: "Aspect Filter", url: "https://aspectfilter.streamlit.app" },
          { name: "All Cycles", url: "https://allcycles.streamlit.app" },
          { name: "Stock Scanner Aspect", url: "https://stock-scanner-ascpect.streamlit.app" },
          { name: "Nakshtra", url: "https://nakshtra.streamlit.app" },
          { name: "FnO Price Cycle", url: "https://fnopricecycle.streamlit.app" },
          { name: "Gann Cycle", url: "https://ganncycle.streamlit.app" },
          { name: "Nifty Time Cycle", url: "https://niftytimecycle.streamlit.app" },
          { name: "Geo Trader", url: "https://geotrader.streamlit.app" },
          { name: "Astro Samadhan", url: "https://astrosamadhan.streamlit.app" },
          { name: "Lal Kitab", url: "https://lalkitab.streamlit.app" },
          { name: "Live Planet Position", url: "https://liveplanetpostion.streamlit.app" },
          { name: "Sun Cycle", url: "https://suncycle.streamlit.app" }
        ]
      },
      {
        category: "Options & F&O Analytics",
        icon: "fa-solid fa-chart-line",
        colorClass: "color-options",
        apps: [
          { name: "FnO Reversal Point", url: "https://fnoreversalpnt.streamlit.app" },
          { name: "Gamma Scan 1", url: "https://gammascan.streamlit.app" },
          { name: "Gamma Scan 2", url: "https://gammascan1.streamlit.app" },
          { name: "Option Chain Gaurav", url: "https://optionchainbygaurav.streamlit.app" },
          { name: "OI Gaurav", url: "https://oiwithgaurav.streamlit.app" },
          { name: "OI GSY", url: "https://oiwithgsy.streamlit.app" },
          { name: "OI Decay", url: "https://oidecay.streamlit.app" },
          { name: "FnO Backtesting", url: "https://fnobacktesting.streamlit.app" }
        ]
      },
      {
        category: "Live Market & Scanners",
        icon: "fa-solid fa-bolt",
        colorClass: "color-market",
        apps: [
          { name: "FII DII Data", url: "https://fiidii.streamlit.app" },
          { name: "Intraday Reversal", url: "https://intradayreversal.streamlit.app" },
          { name: "Last Traded Price", url: "https://lasttradedprice.streamlit.app" },
          { name: "Nifty Live GS", url: "https://niftylivebygs.streamlit.app" },
          { name: "Nubra LTP", url: "https://nubraltp.streamlit.app" },
          { name: "Market Depth GS", url: "https://marketdepthgs.streamlit.app" },
          { name: "Orderbook Track", url: "https://orderbooktrack.streamlit.app" },
          { name: "Screeners App", url: "https://screenersapp.streamlit.app" }
        ]
      },
      {
        category: "Technical & Fundamentals",
        icon: "fa-solid fa-chart-pie",
        colorClass: "color-technical",
        apps: [
          { name: "Fundamental GS", url: "https://fundamentalgs.streamlit.app" },
          { name: "MFH Analysis 1", url: "https://mfhanalysis.streamlit.app" },
          { name: "MFH Analysis 2", url: "https://mfhanalysis2.streamlit.app" },
          { name: "Dow Theory", url: "https://dowtheory.streamlit.app" },
          { name: "Sector Analysis", url: "https://sectoranalysis.streamlit.app" },
          { name: "Tech Funda", url: "https://techfunda.streamlit.app" },
          { name: "Technical GS", url: "https://technicalgs.streamlit.app" }
        ]
      },
      {
        category: "News & Tools",
        icon: "fa-solid fa-newspaper",
        colorClass: "color-news",
        apps: [
          { name: "Backtest 111", url: "https://backtest111.streamlit.app" },
          { name: "All News", url: "https://allnews.streamlit.app" },
          { name: "One India News", url: "https://oneindianews.streamlit.app" },
          { name: "Trading Journal GS", url: "https://tradingjournalgs.streamlit.app" }
        ]
      },
      {
        category: "Utilities & Weather",
        icon: "fa-solid fa-cloud-sun",
        colorClass: "color-utilities",
        apps: [
          { name: "Master Data GS", url: "https://masterdatags.streamlit.app" },
          { name: "GS World 1", url: "https://gsworld.streamlit.app" },
          { name: "GS World 2", url: "https://gsworld1.streamlit.app" },
          { name: "GS Library", url: "https://gslibrary.streamlit.app" },
          { name: "Backup Multi", url: "https://backupmulti.streamlit.app" },
          { name: "Multis", url: "https://multis.streamlit.app" },
          { name: "Contact App", url: "https://8003994518.streamlit.app" },
          { name: "Rulebook 24", url: "https://rulebook24.streamlit.app" },
          { name: "RB 1122", url: "https://rb1122.streamlit.app" },
          { name: "Sec Sea", url: "https://secsea.streamlit.app" },
          { name: "Rao Saab App", url: "https://raosaab.streamlit.app" },
          { name: "USA Weather", url: "https://usaweather.streamlit.app" },
          { name: "USA Weather 1", url: "https://usaweather1.streamlit.app" },
          { name: "USA Weather 2", url: "https://usaweather2.streamlit.app" },
          { name: "USA Weather 3", url: "https://usaweather3.streamlit.app" },
          { name: "USA Weather 4", url: "https://usaweather4.streamlit.app" }
        ]
      }
    ];

    let currentUrl = "";
    const appListContainer = document.getElementById('appList');
    const iframe = document.getElementById('appViewer');
    const loader = document.getElementById('loader');
    const activeAppTitle = document.getElementById('activeAppTitle');

    function renderList() {
      appListContainer.innerHTML = '';
      appsData.forEach((group, gIdx) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category-card';
        catDiv.innerHTML = `
          <div class="category-header">
            <span><i class="${group.icon} badge-icon ${group.colorClass}"></i> ${group.category}</span>
            <span style="font-size:0.7rem; opacity:0.6;">${group.apps.length}</span>
          </div>
        `;
        
        const grid = document.createElement('div');
        grid.className = 'app-grid';

        group.apps.forEach((app, aIdx) => {
          const btn = document.createElement('a');
          btn.className = 'app-item';
          btn.innerHTML = `
            <span>${app.name}</span>
            <i class="fa-solid fa-arrow-right-long open-ext"></i>
          `;
          
          if(gIdx === 0 && aIdx === 0) {
            btn.classList.add('active');
            loadApp(app.url, app.name, btn);
          }

          btn.onclick = (e) => {
            e.preventDefault();
            loadApp(app.url, app.name, btn);
          };
          grid.appendChild(btn);
        });

        catDiv.appendChild(grid);
        appListContainer.appendChild(catDiv);
      });
    }

    function loadApp(url, name, element) {
      if(currentUrl === url) return;
      currentUrl = url;
      showLoader();
      
      document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      
      activeAppTitle.textContent = name;
      iframe.src = `${url}/?embed=true`;
    }

    function showLoader() { loader.style.opacity = '1'; loader.style.pointerEvents = 'all'; }
    function hideLoader() { loader.style.opacity = '0'; loader.style.pointerEvents = 'none'; }
    
    function reloadIframe() {
      showLoader();
      iframe.src = iframe.src;
    }

    function openExternal() {
      if(currentUrl) window.open(currentUrl, '_blank');
    }

    function filterApps() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.app-item').forEach(item => {
        const match = item.textContent.toLowerCase().includes(q);
        item.style.display = match ? 'flex' : 'none';
      });

      document.querySelectorAll('.category-card').forEach(card => {
        const hasVisible = Array.from(card.querySelectorAll('.app-item')).some(i => i.style.display !== 'none');
        card.style.display = hasVisible ? 'block' : 'none';
      });
    }

    renderList();
  </script>
</body>
</html>
